name: Build APKs

on:
  workflow_dispatch:
  push:
    branches: ["**"]
    paths-ignore:
      - "README.md"
      - "fastlane/**"
      - "assets/**"
      - ".github/**/*.md"
      - ".github/FUNDING.yml"
      - ".github/ISSUE_TEMPLATE/**"

permissions:
  contents: write
  discussions: write

jobs:
  build_release:
    name: Build Release (${{ matrix.variant }})
    if: github.actor != 'dependabot[bot]' && github.actor != 'renovate[bot]'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: foss
            variantName: Foss
          - variant: gms
            variantName: Gms

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-encryption-key: ${{ secrets.GRADLE_CACHE_KEY }}
          cache-cleanup: on-success

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Prepare fallback signing keystore if repository keystore secret is absent
        id: fallback_ks
        env:
          HAS_SECRET_KS: ${{ secrets.KEYSTORE != '' }}
        run: |
          if [ "$HAS_SECRET_KS" != "true" ]; then
            keytool -genkeypair -v \
              -keystore app/quick-release.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Glossy-W,O=Glossy-W,C=US"
            echo "use_fallback=true" >> "$GITHUB_OUTPUT"
          else
            echo "use_fallback=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Release APK
        run: ./gradlew assemble${{ matrix.variantName }}Release --stacktrace --parallel --configure-on-demand
        env:
          GLOSSY_APPLICATION_ID: com.merad.glossyw
          GLOSSY_APP_NAME: Glossy-W
          GLOSSY_DEBUG_KEYSTORE_PATH: ${{ steps.fallback_ks.outputs.use_fallback == 'true' && 'quick-release.keystore' || '' }}
          PULL_REQUEST: "false"
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}

      - name: Sign APK
        if: steps.fallback_ks.outputs.use_fallback != 'true'
        uses: ilharp/sign-android-release@v2.0.0
        with:
          releaseDir: app/build/outputs/apk/${{ matrix.variant }}/release/
          signingKey: ${{ secrets.KEYSTORE }}
          keyAlias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
          buildToolsVersion: 35.0.0

      - name: Move signed APK
        run: |
          OUTPUT_DIR="app/build/outputs/apk/${{ matrix.variant }}/release"
          mkdir -p "$OUTPUT_DIR/out"
          if [ "${{ matrix.variant }}" = "gms" ]; then
            TARGET_NAME="Glossy-W-universal-with-Google-Cast.apk"
          else
            TARGET_NAME="Glossy-W-universal-release.apk"
          fi
          SIGNED_FILE=$(find "$OUTPUT_DIR" -maxdepth 1 \( -name "*-signed.apk" -o -name "*-release.apk" \) | head -n 1)
          cp "$SIGNED_FILE" "$OUTPUT_DIR/out/$TARGET_NAME"

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.variant == 'gms' && 'app-with-Google-Cast' || 'app-release' }}
          path: app/build/outputs/apk/${{ matrix.variant }}/release/out/*
