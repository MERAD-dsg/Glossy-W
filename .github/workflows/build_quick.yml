name: Quick Test Build

on:
  workflow_dispatch:
  push:
    branches: ["**"]
    paths-ignore:
      - "README.md"
      - "fastlane/**"
      - "assets/**"
      - ".github/**/*.md"
      - ".github/FUNDING.yml"
      - ".github/ISSUE_TEMPLATE/**"

permissions:
  contents: write

jobs:
  build_quick:
    name: Quick Universal Release Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-encryption-key: ${{ secrets.GRADLE_CACHE_KEY }}
          cache-cleanup: on-success

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Prepare fallback signing keystore if repository keystore secret is absent
        id: fallback_ks
        env:
          HAS_SECRET_KS: ${{ secrets.KEYSTORE != '' }}
        run: |
          if [ "$HAS_SECRET_KS" != "true" ]; then
            keytool -genkeypair -v \
              -keystore app/quick-release.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Glossy-W,O=Glossy-W,C=US"
            echo "use_fallback=true" >> "$GITHUB_OUTPUT"
          else
            echo "use_fallback=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Release APK (No Lint)
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --console=plain assembleFossRelease --warning-mode summary -x lint -x lintFossRelease 2>&1 | tee gradle.log || {
            grep -E "^e: |FAILURE:|What went wrong:|^\* |Exception|Error:" -A 5 gradle.log | head -n 90 | while IFS= read -r line; do
              echo "::error::${line}"
            done
            tail -n 45 gradle.log | while IFS= read -r line; do
              echo "::warning::${line}"
            done
            exit 1
          }
        env:
          GLOSSY_APPLICATION_ID: com.merad.glossyw
          GLOSSY_APP_NAME: Glossy-W
          GLOSSY_DEBUG_KEYSTORE_PATH: ${{ steps.fallback_ks.outputs.use_fallback == 'true' && 'quick-release.keystore' || '' }}
          PULL_REQUEST: "false"
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}

      - name: Sign APK with repository secret keystore
        if: steps.fallback_ks.outputs.use_fallback != 'true'
        uses: ilharp/sign-android-release@v2.0.0
        with:
          releaseDir: app/build/outputs/apk/foss/release/
          signingKey: ${{ secrets.KEYSTORE }}
          keyAlias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
          buildToolsVersion: 35.0.0

      - name: Collect signed APK
        run: |
          OUTPUT_DIR="app/build/outputs/apk/foss/release"
          mkdir -p "$OUTPUT_DIR/out"
          SIGNED_FILE=$(find "$OUTPUT_DIR" -maxdepth 1 \( -name "*-signed.apk" -o -name "*-release.apk" \) | head -n 1)
          cp "$SIGNED_FILE" "$OUTPUT_DIR/out/Glossy-W-universal-release.apk"

      - name: Upload Signed APK
        uses: actions/upload-artifact@v6
        with:
          name: Glossy-W-universal-release
          path: app/build/outputs/apk/foss/release/out/*
